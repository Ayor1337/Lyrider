name: Release MSIX

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing three-part release tag (for example, v1.1.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
      MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              '${{ inputs.tag }}'
          }
          else {
              $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag must use vMajor.Minor.Patch format: $tag"
          }

          $releaseVersion = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$releaseVersion" >> $env:GITHUB_OUTPUT
          "package=$releaseVersion.0" >> $env:GITHUB_OUTPUT

      - name: Test
        shell: pwsh
        run: dotnet test .\tests\Lyrider.Tests\Lyrider.Tests.csproj -c Release

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
              throw 'Repository secret MSIX_CERTIFICATE_BASE64 is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_PASSWORD)) {
              throw 'Repository secret MSIX_CERTIFICATE_PASSWORD is not configured.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'Lyrider-signing.pfx'
          try {
              [IO.File]::WriteAllBytes(
                  $pfxPath,
                  [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
              $password = ConvertTo-SecureString $env:MSIX_CERTIFICATE_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate `
                  -FilePath $pfxPath `
                  -CertStoreLocation Cert:\CurrentUser\My `
                  -Password $password `
                  -Exportable
          }
          finally {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          if (-not $certificate.HasPrivateKey) {
              throw 'The imported certificate does not contain a private key.'
          }

          "publisher=$($certificate.Subject)" >> $env:GITHUB_OUTPUT
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        run: >-
          .\scripts\package-msix.ps1
          -Version '${{ steps.version.outputs.package }}'
          -Platform x64
          -Configuration Release
          -Publisher '${{ steps.certificate.outputs.publisher }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lyrider_${{ steps.version.outputs.release }}_x64
          path: |
            AppPackages/Lyrider_${{ steps.version.outputs.package }}_x64/*.msix
            AppPackages/Lyrider_${{ steps.version.outputs.package }}_x64/*.cer
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $outputDirectory = "AppPackages/Lyrider_${{ steps.version.outputs.package }}_x64"
          $assets = Get-ChildItem $outputDirectory -File |
              Where-Object Extension -in '.msix', '.cer' |
              ForEach-Object FullName

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
              $notesPath = ".github/release-notes/$tag.md"
              $notesArgs = if (Test-Path -LiteralPath $notesPath) {
                  @('--notes-file', $notesPath)
              }
              else {
                  @('--generate-notes')
              }
              gh release create $tag @assets `
                  --verify-tag `
                  @notesArgs `
                  --title $tag `
                  --repo $env:GITHUB_REPOSITORY
          }

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item -LiteralPath 'Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}' -Force
